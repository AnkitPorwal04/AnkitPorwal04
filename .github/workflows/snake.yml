name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Personal token required: the default Actions token gets an
          # empty contribution calendar from the GraphQL API.
          github_token: ${{ secrets.SNAKE_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6C63FF&color_dots=#ebedf0,#d8d1ff,#b3a7fb,#8c7dfa,#6C63FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#9F7AEA&color_dots=#161b22,#2d2a5e,#473d8f,#6C63FF,#9f7aea

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
